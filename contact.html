<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Book a free AI workflow audit with Blacksquare Labs. We'll find where your team is losing time and show exactly what can be automated. Reply within 24 hours.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://blacksquarelabs.dev/contact">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://blacksquarelabs.dev/contact">
    <meta property="og:title" content="Book a Free AI Automation Audit | Blacksquare Labs">
    <meta property="og:description" content="Tell us what's taking too long. We'll map where AI can help and reply within 24 hours. No cost, no commitment.">
    <meta property="og:image" content="https://blacksquarelabs.dev/assets/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Book a Free AI Automation Audit | Blacksquare Labs">
    <meta name="twitter:description" content="Tell us what's taking too long. We'll map where AI can help and reply within 24 hours. No cost, no commitment.">
    <meta name="twitter:image" content="https://blacksquarelabs.dev/assets/og-image.png">
    <title>Book a Free AI Automation Audit | Blacksquare Labs</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/assets/icon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="sitemap" type="application/xml" href="/sitemap.xml">
    <link rel="stylesheet" href="/styles.css?v=20260515-11">
  </head>
  <body class="contact-page">
    <canvas class="warp-grid" id="warp-grid" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>
    <div class="spotlight" aria-hidden="true"></div>

    <header class="site-header">
      <a href="/" class="wordmark" aria-label="Blacksquare Labs home">
        <img src="/assets/blacksquarelabs_logo_figma_export.png" alt="Blacksquare Labs">
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="/#build">Work</a>
        <a href="/#method">Method</a>
        <a href="/" class="nav-cta">Back home</a>
      </nav>
    </header>

    <main class="contact-main">
      <section class="contact-hero" aria-labelledby="contact-title">
        <p class="eyebrow">BSL · 04 / Free audit</p>
        <h1 id="contact-title">Book the first conversation.</h1>
        <p>Tell us what's taking too long or costing too much. We'll reply with next steps within a day.</p>
      </section>

      <form class="contact-form" action="https://formsubmit.co/hello@blacksquarelabs.dev" method="post">
        <input type="hidden" name="_subject" value="Blacksquare Labs audit request">
        <input type="hidden" name="_captcha" value="false">
        <input type="text" name="_honey" tabindex="-1" autocomplete="off" class="honeypot" aria-hidden="true">
        <label>
          Name
          <input name="name" autocomplete="name" required>
        </label>
        <label>
          Work email
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <label>
          Company
          <input name="company" autocomplete="organization">
        </label>
        <label>
          What should AI improve?
          <textarea name="message" rows="6" required></textarea>
        </label>
        <button class="button button-primary" type="submit">Request the audit</button>
      </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/bundled/lenis.min.js" defer></script>
    <script src="/script.js" defer></script>
  </body>
</html>
