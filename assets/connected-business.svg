<svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 600 480" role="img" aria-labelledby="core-title core-description">
  <title id="core-title">Your business, connected by an agentic core</title>
  <desc id="core-description">A natural language request flows into an AI orchestration core, which connects CRM, email, documents, support, finance and operations. This is an illustrative architecture.</desc>
  <defs>
    <linearGradient id="core-face" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f7f7f7"/>
      <stop offset=".46" stop-color="#dddddd"/>
      <stop offset=".58" stop-color="#f0f0f0"/>
      <stop offset="1" stop-color="#bcbcbc"/>
    </linearGradient>
    <linearGradient id="core-edge-cool" gradientUnits="userSpaceOnUse" x1="207" y1="258" x2="278" y2="198">
      <stop stop-color="#375dfb" stop-opacity="0"/>
      <stop offset=".35" stop-color="#375dfb" stop-opacity=".95"/>
      <stop offset=".7" stop-color="#92aaff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#92aaff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="core-edge-warm" gradientUnits="userSpaceOnUse" x1="393" y1="307" x2="328" y2="368">
      <stop stop-color="#92aaff" stop-opacity="0"/>
      <stop offset=".35" stop-color="#92aaff" stop-opacity=".95"/>
      <stop offset=".7" stop-color="#375dfb" stop-opacity=".95"/>
      <stop offset="1" stop-color="#375dfb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="node-face" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#353535" stop-opacity=".72"/>
      <stop offset="1" stop-color="#1c1c1c" stop-opacity=".5"/>
    </linearGradient>
    <pattern id="field" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".75" fill="#cfcfcf" opacity=".16"/>
    </pattern>
  </defs>
  <rect x="6" y="6" width="588" height="468" fill="url(#field)"/>
